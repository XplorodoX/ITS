services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"   # MQTT (TCP) — for ESP8266 firmware clients
      - "9001:9001"   # MQTT over WebSockets — for beamer frontend
    volumes:
      - ./mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mosquitto_sub", "-t", "$$SYS/#", "-C", "1", "-i", "healthcheck", "-W", "3"]
      interval: 10s
      timeout: 5s
      retries: 3

  game-master:
    build:
      context: ./src/backend
    depends_on:
      mosquitto:
        condition: service_healthy
    environment:
      - BROKER=${BROKER:-mosquitto}
      - QUESTIONS=${QUESTIONS:-questions.json}
    command:
      - "--broker"
      - "${BROKER:-mosquitto}"
      - "--questions"
      - "${QUESTIONS:-questions.json}"
    restart: unless-stopped

  frontend:
    build:
      context: ./src/frontend
      args:
        # WebSocket URL the BEAMER'S BROWSER uses to reach the broker. Baked in
        # at build time (NEXT_PUBLIC_*). The browser cannot resolve the internal
        # "mosquitto" service name, so this points at the host-published port.
        # Override for a remote beamer, e.g. NEXT_PUBLIC_MQTT_URL=ws://192.168.1.50:9001.
        NEXT_PUBLIC_MQTT_URL: ${NEXT_PUBLIC_MQTT_URL:-ws://localhost:9001}
    ports:
      - "3000:3000"
    depends_on:
      mosquitto:
        condition: service_healthy
    restart: unless-stopped
