; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp12e]
platform = espressif8266
board = esp12e
framework = arduino
lib_deps =
    adafruit/Adafruit BMP280 Library @ ^2.6.8
    adafruit/Adafruit BME680 Library @ ^2.0.4
    adafruit/Adafruit Unified Sensor @ ^1.1.15
    madhephaestus/WiiChuck @ ^0.4.1
	adafruit/Adafruit NeoPixel @ ^1.10.6
	adafruit/Adafruit GFX Library @ ^1.11.7
	adafruit/Adafruit SSD1306 @ ^2.4.7
	knolleary/PubSubClient @ ^2.8
	bblanchon/ArduinoJson @ ^7.0

monitor_speed = 115200
lib_ldf_mode = deep+

; Einmal-Utility zum Löschen des im EEPROM gespeicherten Spielernamens.
; Nutzung: pio run -e erase_name -t upload, danach Serial-Monitor öffnen,
; und anschließend mit "pio run -e esp12e -t upload" die normale Firmware
; wieder aufspielen.
[env:erase_name]
platform = espressif8266
board = esp12e
framework = arduino
build_src_filter = -<main.cpp> -<audio.cpp> -<display.cpp> -<network.cpp> -<storage.cpp> +<tools/erase_name.cpp>
monitor_speed = 115200
